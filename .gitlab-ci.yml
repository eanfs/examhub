# GitLab CI —— 构建 examhub 大屏 Docker 镜像并推送到华为云 SWR。
#
# 触发：推送到 develop 分支，或打 tag。
# 镜像：swr.cn-east-3.myhuaweicloud.com/intetech/xde-dashboard
#         :<short-sha 或 tag>  +  :latest
#
# 前置条件：
#   1. Settings > CI/CD > Variables 配置（建议勾选 Masked）：
#        SWR_USERNAME  华为云 SWR 登录用户名，格式 cn-east-3@<AK>
#        SWR_PASSWORD  华为云 SWR 登录密钥（由 AK/SK 生成的 login key）
#   2. Runner 需支持 docker-in-docker（privileged 模式）。
#   3. 若 Runner 无法访问 Docker Hub，请把 docker / node 基础镜像
#      替换为内网或 SWR 镜像源。

stages:
  - build

variables:
  SWR_REGISTRY: swr.cn-east-3.myhuaweicloud.com
  IMAGE: swr.cn-east-3.myhuaweicloud.com/intetech/xde-dashboard

docker-build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "develop"'
  before_script:
    - echo "$SWR_PASSWORD" | docker login -u "$SWR_USERNAME" --password-stdin "$SWR_REGISTRY"
  script:
    - TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - echo "Building image $IMAGE:$TAG"
    - docker build -f docker/Dockerfile -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
    - docker push "$IMAGE:$TAG"
    - docker push "$IMAGE:latest"
  after_script:
    - docker logout "$SWR_REGISTRY" || true
